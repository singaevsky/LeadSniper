[tool.poetry]
name = "uyezdny-konditer-python-service"
version = "1.0.0"
description = "Python microservice for Uyezdny Konditer calculations"
authors = ["Uyezdny Konditer Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.28.0"
redis = "^4.6.0"
celery = "^5.3.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
pillow = "^10.0.0"
requests = "^2.31.0"
passlib = "^1.7.4"
python-multipart = "^0.0.6"
python-jose = "^3.3.0"
bcrypt = "^4.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"
isort = "^5.12.0"
pytest-cov = "^4.1.0"
bandit = "^1.7.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true